<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Data & ML Pipeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="title-container">
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <h1>CSV Data & ML Pipeline</h1>
    </div>
    <p class="subtitle">Upload a raw CSV file to clean data and generate an ML matrix.</p>
    
    <form id="upload-form">
      <input type="file" id="csv-file" accept=".csv" required>
      <button type="submit" id="submit-btn">Process CSV</button>
    </form>
    
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
